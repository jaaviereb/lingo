<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingo - Acceso</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <header>
    <h1><span class="marca">Lingo</span></h1>
    <p class="subtitulo">Tu puerta al aprendizaje interactivo</p>
  </header>

  <main class="contenedor">
    <section class="tarjeta acceso">
      <h2>Bienvenido</h2>
      <p class="texto">Inicia sesión o crea tu cuenta en segundos.</p>

      <form action="main.html" method="get" class="formulario">
        <div class="campo">
          <input type="email" id="correo" name="correo" required>
          <label for="correo">Correo</label>
        </div>

        <div class="campo">
          <input type="text" id="usuario" name="usuario" required>
          <label for="usuario">Usuario</label>
        </div>

        <div class="campo">
          <input type="password" id="clave" name="clave" required>
          <label for="clave">Contraseña</label>
        </div>

        <button type="submit" class="boton">Continuar</button>
      </form>
    </section>
  </main>

  <div class="invitado-contenedor">
    <a class="invitado" href="main.html">Jugar como invitado</a>
  </div>

  <footer class="footer-basico">
    <p>&copy; 2025 Lingo. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
